<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>语音解析可视化系统</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </div>
        <div>
          <h1 class="app-title">语音解析可视化系统</h1>
          <p class="app-subtitle">Voice Analysis &amp; Visualization Platform</p>
        </div>
      </div>
      <div class="header-right">
        <div class="status-badge" id="connectionStatus">
          <span class="status-dot" id="statusDot"></span>
          <span class="status-text" id="statusText">连接中...</span>
        </div>
      </div>
    </header>

    <div class="main-content">
      <div class="left-panel">
        <section class="card control-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <circle cx="12" cy="12" r="4"></circle>
                <line x1="4.93" y1="4.93" x2="9.17" y2="9.17"></line>
                <line x1="14.83" y1="14.83" x2="19.07" y2="19.07"></line>
                <line x1="14.83" y1="9.17" x2="19.07" y2="4.93"></line>
                <line x1="14.83" y1="9.17" x2="18.36" y2="5.64"></line>
                <line x1="4.93" y1="19.07" x2="9.17" y2="14.83"></line>
              </svg>
              控制面板
            </h2>
          </div>
          <div class="card-body">
            <div class="mic-control">
              <button class="mic-button" id="micButton" aria-label="启停麦克风">
                <div class="mic-icon-wrap">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                  </svg>
                </div>
                <span class="mic-label" id="micLabel">启动麦克风</span>
                <span class="mic-state" id="micState">OFF</span>
              </button>
              <div class="ring-wave" id="ringWave"></div>
            </div>

            <div class="mode-selector">
              <label class="field-label">识别模式</label>
              <select class="mode-select" id="modeSelect">
                <option value="auto">自动检测（Auto）</option>
                <option value="zh">中文（Chinese）</option>
                <option value="en">English（英语）</option>
                <option value="ja">日本語（日语）</option>
                <option value="ko">한국어（韩语）</option>
                <option value="fr">Français（法语）</option>
                <option value="de">Deutsch（德语）</option>
              </select>
            </div>

            <div class="audio-monitor">
              <label class="field-label">音频监测</label>
              <div class="volume-bar">
                <div class="volume-level" id="volumeLevel"></div>
              </div>
              <div class="volume-meta">
                <span class="volume-value" id="volumeValue">0%</span>
                <span class="volume-peak" id="volumePeak">Peak: 0</span>
              </div>
            </div>
          </div>
        </section>

        <section class="card result-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="9" y1="15" x2="15" y2="15"></line>
                <line x1="9" y1="11" x2="15" y2="11"></line>
              </svg>
              实时识别结果
            </h2>
            <span class="update-badge" id="updateBadge">IDLE</span>
          </div>
          <div class="card-body">
            <div class="result-grid">
              <div class="result-item">
                <span class="result-label">检测语种</span>
                <div class="result-value language-value" id="languageValue">--</div>
              </div>
              <div class="result-item">
                <span class="result-label">口音类型</span>
                <div class="result-value accent-value" id="accentValue">--</div>
              </div>
              <div class="result-item confidence-item">
                <span class="result-label">置信度</span>
                <div class="confidence-bar-wrap">
                  <div class="confidence-bar">
                    <div class="confidence-fill" id="confidenceFill"></div>
                  </div>
                  <span class="confidence-value" id="confidenceValue">0%</span>
                </div>
              </div>
              <div class="result-item">
                <span class="result-label">检测ID</span>
                <div class="result-value id-value" id="detectionId">#0</div>
              </div>
            </div>
          </div>
        </section>

        <section class="card stats-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
              统计数据
            </h2>
          </div>
          <div class="card-body">
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-icon stat-icon-blue">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
                  </svg>
                </div>
                <div class="stat-content">
                  <span class="stat-label">检测次数</span>
                  <span class="stat-value" id="totalDetections">0</span>
                </div>
              </div>
              <div class="stat-box">
                <div class="stat-icon stat-icon-green">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                  </svg>
                </div>
                <div class="stat-content">
                  <span class="stat-label">语音时长</span>
                  <span class="stat-value" id="totalDuration">0s</span>
                </div>
              </div>
              <div class="stat-box">
                <div class="stat-icon stat-icon-purple">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  </svg>
                </div>
                <div class="stat-content">
                  <span class="stat-label">识别片段</span>
                  <span class="stat-value" id="totalSegments">0</span>
                </div>
              </div>
              <div class="stat-box">
                <div class="stat-icon stat-icon-orange">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="20" x2="12" y2="10"></line>
                    <line x1="18" y1="20" x2="18" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="16"></line>
                  </svg>
                </div>
                <div class="stat-content">
                  <span class="stat-label">平均置信度</span>
                  <span class="stat-value" id="avgConfidence">0%</span>
                </div>
              </div>
            </div>
            <div class="lang-distribution">
              <label class="field-label">语种分布</label>
              <div class="lang-bars" id="langBars"></div>
            </div>
          </div>
        </section>
      </div>

      <div class="right-panel">
        <section class="card waveform-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
              </svg>
              实时波形图谱
            </h2>
            <div class="waveform-tabs">
              <button class="wave-tab active" data-view="waveform" id="tabWaveform">波形</button>
              <button class="wave-tab" data-view="spectrum" id="tabSpectrum">频谱</button>
              <button class="wave-tab" data-view="circular" id="tabCircular">环形</button>
            </div>
          </div>
          <div class="card-body waveform-body">
            <canvas id="waveformCanvas"></canvas>
            <div class="waveform-overlay">
              <span class="overlay-label" id="overlayFreq">0 Hz</span>
              <span class="overlay-label right" id="overlayTime">00:00</span>
            </div>
          </div>
        </section>

        <section class="card segments-card">
          <div class="card-header">
            <h2 class="card-title">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              识别记录汇总
              <span class="segment-count" id="segmentCount">0</span>
            </h2>
            <button class="clear-btn" id="clearSegments" title="清空记录">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              清空
            </button>
          </div>
          <div class="card-body segments-body">
            <div class="segments-list" id="segmentsList">
              <div class="empty-state">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                  <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                  <line x1="12" y1="19" x2="12" y2="23"></line>
                  <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <p>暂无识别记录</p>
                <p class="empty-hint">启动麦克风开始语音采集</p>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
